<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube Floating Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #mount, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="mount"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var vid = String(params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
      var listId = String(params.get('list') || '').replace(/[^A-Za-z0-9_-]/g, '');
      var start = Math.max(0, Math.floor(Number(params.get('start')) || 0));
      var autoplay = params.get('autoplay') === '0' ? '0' : '1';
      var loopEnabled = params.get('loop') === '1';
      var mute = params.get('mute') === '1' ? '1' : '0';
      var rate = Number(params.get('rate')) || 1;
      var vol = params.has('vol') ? Math.max(0, Math.min(100, Number(params.get('vol')) || 85)) : 85;
      var sid = String(params.get('sid') || 'default');

      if (!vid && !listId) return;

      var q = new URLSearchParams();
      q.set('autoplay', autoplay);
      q.set('rel', '0');
      q.set('modestbranding', '1');
      q.set('playsinline', '1');
      q.set('enablejsapi', '1');
      q.set('controls', '1');
      if (start > 0) q.set('start', String(start));
      if (mute === '1') q.set('mute', '1');
      if (loopEnabled && vid) {
        q.set('loop', '1');
        q.set('playlist', vid);
      }
      if (listId) q.set('list', listId);
      if (window.location.origin && /^https?:/i.test(window.location.origin)) {
        q.set('origin', window.location.origin);
      }

      var base = vid
        ? 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(vid)
        : 'https://www.youtube-nocookie.com/embed/videoseries';

      var iframe = document.createElement('iframe');
      iframe.id = 'yt-inner-embed';
      iframe.src = base + '?' + q.toString();
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
      iframe.setAttribute('allowfullscreen', '');
      document.getElementById('mount').appendChild(iframe);

      var ytPlayer = null;
      var ytReady = false;
      var acked = false;
      var appliedInitialPrefs = false;
      var handshakeTimer = null;
      var pollTimer = null;
      var pendingCmds = [];
      var lastInfo = {
        currentTime: start,
        duration: 0,
        playerState: autoplay === '1' ? 1 : 2,
        playbackRate: rate,
        volume: vol,
        muted: mute === '1'
      };

      function postSyncToParent(infoObj) {
        if (!infoObj) return;
        var msg = { __mod39PipSync: true, type: 'sync', sid: sid, info: infoObj };
        var sentToParent = false;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, '*');
            sentToParent = true;
          }
        } catch (_eP) {}
        if (!sentToParent) {
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(msg, '*');
            }
          } catch (_eO) {}
        }
      }

      function sendRawToYt(payload) {
        try {
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage(JSON.stringify(payload), '*');
          }
        } catch (_e) {}
      }

      function execYtCommand(func, args) {
        var safeArgs = Array.isArray(args) ? args.slice() : [];
        if (func === 'setLoop') {
          loopEnabled = Boolean(safeArgs[0]);
        }
        if (func === 'setPlaybackRate' && typeof safeArgs[0] === 'number' && safeArgs[0] > 2) {
          safeArgs[0] = 2;
        }
        if (!ytReady && !acked) {
          if (pendingCmds.length < 24) {
            pendingCmds.push({ func: func, args: safeArgs });
          }
        }
        // 1) Thực thi qua YT.Player API chính thức nếu đã gắn xong
        if (ytPlayer && ytReady && typeof ytPlayer[func] === 'function') {
          try {
            ytPlayer[func].apply(ytPlayer, safeArgs);
          } catch (_eApi) {}
        }
        // 2) Luôn gửi kèm postMessage chuẩn JSON command để bảo đảm 100% lệnh đi vào iframe
        sendRawToYt({
          event: 'command',
          func: func,
          args: safeArgs,
          id: 1,
          channel: 'widget'
        });
        if (func === 'seekTo' && typeof safeArgs[0] === 'number') {
          lastInfo.currentTime = Math.max(0, safeArgs[0]);
          postSyncToParent(Object.assign({}, lastInfo));
        } else if (func === 'playVideo') {
          lastInfo.playerState = 1;
          postSyncToParent(Object.assign({}, lastInfo));
        } else if (func === 'pauseVideo') {
          lastInfo.playerState = 2;
          postSyncToParent(Object.assign({}, lastInfo));
        } else if (func === 'setPlaybackRate' && typeof safeArgs[0] === 'number') {
          lastInfo.playbackRate = safeArgs[0];
          postSyncToParent(Object.assign({}, lastInfo));
        } else if (func === 'mute') {
          lastInfo.muted = true;
          postSyncToParent(Object.assign({}, lastInfo));
        } else if (func === 'unMute') {
          lastInfo.muted = false;
          postSyncToParent(Object.assign({}, lastInfo));
        } else if (func === 'setVolume' && typeof safeArgs[0] === 'number') {
          lastInfo.volume = safeArgs[0];
          postSyncToParent(Object.assign({}, lastInfo));
        }
      }

      function flushPendingCommands() {
        if (!pendingCmds.length) return;
        var queue = pendingCmds.splice(0, pendingCmds.length);
        for (var i = 0; i < queue.length; i++) {
          execYtCommand(queue[i].func, queue[i].args);
        }
      }

      function applyInitialPrefsOnce() {
        if (appliedInitialPrefs) return;
        appliedInitialPrefs = true;
        setTimeout(function () {
          if (rate && Math.abs(rate - 1) > 0.01) {
            execYtCommand('setPlaybackRate', [rate > 2 ? 2 : rate]);
          }
          if (mute === '1') {
            execYtCommand('mute', []);
          } else {
            execYtCommand('unMute', []);
            execYtCommand('setVolume', [vol]);
          }
          flushPendingCommands();
        }, 120);
      }

      function startHandshake() {
        if (handshakeTimer) clearInterval(handshakeTimer);
        var tries = 0;
        var pulse = function () {
          if (acked || tries >= 30) {
            if (handshakeTimer) {
              clearInterval(handshakeTimer);
              handshakeTimer = null;
            }
            return;
          }
          tries += 1;
          sendRawToYt({ event: 'listening', id: 1, channel: 'widget' });
        };
        pulse();
        handshakeTimer = setInterval(pulse, 200);
      }

      function startPollingYtPlayer() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(function () {
          if (!ytPlayer || !ytReady) return;
          try {
            var t = typeof ytPlayer.getCurrentTime === 'function' ? ytPlayer.getCurrentTime() : undefined;
            var d = typeof ytPlayer.getDuration === 'function' ? ytPlayer.getDuration() : undefined;
            var s = typeof ytPlayer.getPlayerState === 'function' ? ytPlayer.getPlayerState() : undefined;
            var r = typeof ytPlayer.getPlaybackRate === 'function' ? ytPlayer.getPlaybackRate() : undefined;
            var v = typeof ytPlayer.getVolume === 'function' ? ytPlayer.getVolume() : undefined;
            var m = typeof ytPlayer.isMuted === 'function' ? ytPlayer.isMuted() : undefined;
            if (typeof t === 'number' && isFinite(t)) lastInfo.currentTime = t;
            if (typeof d === 'number' && d > 0) lastInfo.duration = d;
            if (typeof s === 'number') lastInfo.playerState = s;
            if (typeof r === 'number' && r > 0) lastInfo.playbackRate = r;
            if (typeof v === 'number' && isFinite(v)) lastInfo.volume = v;
            if (typeof m === 'boolean') lastInfo.muted = m;
            postSyncToParent(Object.assign({}, lastInfo));
          } catch (_ePoll) {}
        }, 250);
      }

      // Nạp YouTube IFrame API chính thức gắn đúng host youtube-nocookie.com để điều khiển & đọc giây chính xác 100%
      function attachYtApi() {
        if (ytPlayer || !window.YT || !window.YT.Player) return;
        try {
          ytPlayer = new window.YT.Player('yt-inner-embed', {
            host: 'https://www.youtube-nocookie.com',
            events: {
              onReady: function () {
                ytReady = true;
                applyInitialPrefsOnce();
                flushPendingCommands();
                startPollingYtPlayer();
              },
              onStateChange: function (e) {
                if (typeof e.data === 'number') {
                  lastInfo.playerState = e.data;
                  postSyncToParent(Object.assign({}, lastInfo));
                  if (e.data === 0 && loopEnabled) {
                    execYtCommand('seekTo', [0, true]);
                    execYtCommand('playVideo', []);
                  }
                }
              },
              onPlaybackRateChange: function (e) {
                if (typeof e.data === 'number' && e.data > 0) {
                  lastInfo.playbackRate = e.data;
                  postSyncToParent(Object.assign({}, lastInfo));
                }
              }
            }
          });
        } catch (_eYt) {}
      }

      window.onYouTubeIframeAPIReady = attachYtApi;
      var apiScript = document.createElement('script');
      apiScript.src = 'https://www.youtube.com/iframe_api';
      apiScript.async = true;
      document.head.appendChild(apiScript);

      iframe.addEventListener('load', function () {
        acked = false;
        startHandshake();
        if (window.YT && window.YT.Player) attachYtApi();
      });

      // Nhận lệnh điều khiển trực tiếp từ Studio chính + infoDelivery từ YouTube
      window.addEventListener('message', function (ev) {
        if (!ev || !ev.data) return;

        // A) Lệnh từ Studio chính (Play/Pause/Seek/Tốc độ/Lặp/Âm lượng/Tắt tiếng)
        if (typeof ev.data === 'object' && ev.data.__mod39PipCmd) {
          if (ev.data.sid && ev.data.sid !== sid) return;
          if (ev.data.type === 'close') {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            if (handshakeTimer) { clearInterval(handshakeTimer); handshakeTimer = null; }
            try { iframe.src = 'about:blank'; } catch (_eC) {}
            return;
          }
          if (ev.data.func) {
            execYtCommand(ev.data.func, ev.data.args || []);
          }
          return;
        }

        // B) Thông điệp infoDelivery từ YouTube embed
        var org = String(ev.origin || '');
        if (org && org.indexOf('youtube.com') === -1 && org.indexOf('youtube-nocookie.com') === -1) return;
        var data = ev.data;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch (_e) { return; }
        }
        if (!data || typeof data !== 'object') return;

        if (!acked) {
          acked = true;
          if (handshakeTimer) {
            clearInterval(handshakeTimer);
            handshakeTimer = null;
          }
          ['onStateChange', 'onPlaybackRateChange', 'onError'].forEach(function (evName) {
            sendRawToYt({ event: 'command', func: 'addEventListener', args: [evName], id: 1, channel: 'widget' });
          });
          flushPendingCommands();
        }

        if (data.event === 'onReady' || data.event === 'initialDelivery' || data.event === 'infoDelivery') {
          applyInitialPrefsOnce();
        }

        if ((data.event === 'infoDelivery' || data.event === 'initialDelivery') && data.info && typeof data.info === 'object') {
          if (typeof data.info.currentTime === 'number' && isFinite(data.info.currentTime)) lastInfo.currentTime = data.info.currentTime;
          if (typeof data.info.duration === 'number' && data.info.duration > 0) lastInfo.duration = data.info.duration;
          if (typeof data.info.playerState === 'number') {
            lastInfo.playerState = data.info.playerState;
            if (data.info.playerState === 0 && loopEnabled) {
              execYtCommand('seekTo', [0, true]);
              execYtCommand('playVideo', []);
            }
          }
          if (typeof data.info.playbackRate === 'number' && data.info.playbackRate > 0) lastInfo.playbackRate = data.info.playbackRate;
          if (typeof data.info.volume === 'number' && isFinite(data.info.volume)) lastInfo.volume = data.info.volume;
          if (typeof data.info.muted === 'boolean') lastInfo.muted = data.info.muted;
          postSyncToParent(Object.assign({}, lastInfo));
        }
      });

      window.addEventListener('pagehide', function () {
        if (pollTimer) clearInterval(pollTimer);
        if (handshakeTimer) clearInterval(handshakeTimer);
        try { iframe.src = 'about:blank'; } catch (_eH) {}
      });
    })();
  </script>
</body>
</html>
