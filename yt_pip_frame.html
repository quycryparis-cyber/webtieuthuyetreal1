<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube Floating Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #mount, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="mount"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var vid = String(params.get('v') || params.get('vid') || '').replace(/[^A-Za-z0-9_-]/g, '');
      var listId = String(params.get('list') || '').replace(/[^A-Za-z0-9_-]/g, '');
      var start = Math.max(0, Math.floor(Number(params.get('start')) || 0));
      var autoplay = params.get('autoplay') === '0' ? '0' : '1';
      var loopEnabled = params.get('loop') === '1';
      var mute = params.get('mute') === '1' ? '1' : '0';
      var rate = Number(params.get('rate')) || 1;
      var vol = params.has('vol') ? Math.max(0, Math.min(100, Number(params.get('vol')) || 85)) : 85;
      var sid = String(params.get('sid') || 'default');

      // Tham số Lặp đoạn A-B chạy trực tiếp bên trong Cửa sổ nổi (chính xác ngay cả khi tab chính bị thu nhỏ!)
      var abState = {
        enabled: params.get('ab') === '1',
        startSec: params.has('aba') && params.get('aba') !== '' ? Number(params.get('aba')) : null,
        endSec: params.has('abb') && params.get('abb') !== '' ? Number(params.get('abb')) : null,
        lastJumpAtMs: 0
      };

      if (!vid && !listId) return;

      // Dựng <iframe> trước với đầy đủ referrerpolicy & enablejsapi=1 (y hệt khung chính đã chứng minh chạy 100% trên Desktop!)
      var q = new URLSearchParams();
      q.set('enablejsapi', '1');
      q.set('widgetid', '1');
      q.set('rel', '0');
      q.set('modestbranding', '1');
      q.set('playsinline', '1');
      q.set('iv_load_policy', '3');
      q.set('autoplay', autoplay);
      q.set('controls', '1');
      if (start > 0) q.set('start', String(start));
      if (mute === '1') q.set('mute', '1');
      if (loopEnabled && vid) {
        q.set('loop', '1');
        q.set('playlist', vid);
      }
      if (listId) q.set('list', listId);
      if (window.location.origin && /^https?:/i.test(window.location.origin)) {
        q.set('origin', window.location.origin);
      }

      var base = vid
        ? 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(vid)
        : 'https://www.youtube-nocookie.com/embed/videoseries';

      var iframe = document.createElement('iframe');
      iframe.id = 'yt-inner-embed';
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.src = base + '?' + q.toString();
      document.getElementById('mount').appendChild(iframe);

      var ytPlayer = null;
      var ytReady = false;
      var acked = false;
      var ytWidgetId = 1;
      var appliedInitialPrefs = false;
      var handshakeTimer = null;
      var pollTimer = null;
      var pendingCmds = [];
      var lastInfo = {
        videoId: vid,
        title: '',
        currentTime: start,
        duration: 0,
        playerState: autoplay === '1' ? 1 : 2,
        playbackRate: rate,
        volume: vol,
        muted: mute === '1'
      };

      function postSyncToParent(infoObj) {
        if (!infoObj) return;
        var msg = { __mod39PipSync: true, type: 'sync', sid: sid, info: infoObj };
        var sentToParent = false;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, '*');
            sentToParent = true;
          }
        } catch (_eP) {}
        if (!sentToParent) {
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(msg, '*');
            }
          } catch (_eO) {}
        }
      }

      function sendRawToYt(payload) {
        try {
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage(JSON.stringify(payload), '*');
          }
        } catch (_e) {}
      }

      function readLiveSnapshotFromYtPlayer() {
        if (ytPlayer && ytReady) {
          try {
            var t = typeof ytPlayer.getCurrentTime === 'function' ? ytPlayer.getCurrentTime() : undefined;
            var d = typeof ytPlayer.getDuration === 'function' ? ytPlayer.getDuration() : undefined;
            var s = typeof ytPlayer.getPlayerState === 'function' ? ytPlayer.getPlayerState() : undefined;
            var r = typeof ytPlayer.getPlaybackRate === 'function' ? ytPlayer.getPlaybackRate() : undefined;
            var v = typeof ytPlayer.getVolume === 'function' ? ytPlayer.getVolume() : undefined;
            var m = typeof ytPlayer.isMuted === 'function' ? ytPlayer.isMuted() : undefined;
            var vd = typeof ytPlayer.getVideoData === 'function' ? ytPlayer.getVideoData() : null;
            if (typeof t === 'number' && isFinite(t) && t >= 0) lastInfo.currentTime = t;
            if (typeof d === 'number' && isFinite(d) && d > 0) lastInfo.duration = d;
            if (typeof s === 'number') lastInfo.playerState = s;
            if (typeof r === 'number' && isFinite(r) && r > 0) lastInfo.playbackRate = r;
            if (typeof v === 'number' && isFinite(v)) lastInfo.volume = v;
            if (typeof m === 'boolean') lastInfo.muted = m;
            if (vd && typeof vd === 'object') {
              if (vd.video_id && /^[A-Za-z0-9_-]{11}$/.test(String(vd.video_id))) {
                lastInfo.videoId = String(vd.video_id);
              }
              if (vd.title) lastInfo.title = String(vd.title);
            }
          } catch (_eRead) {}
        }
        return Object.assign({}, lastInfo);
      }

      function enforceLocalAbLoop() {
        if (!abState.enabled) return false;
        if (typeof abState.startSec !== 'number' || typeof abState.endSec !== 'number') return false;
        if (!isFinite(abState.startSec) || !isFinite(abState.endSec) || abState.endSec <= abState.startSec) return false;
        if (lastInfo.playerState !== 1 && lastInfo.playerState !== 3) return false;
        var now = Date.now();
        if (now - abState.lastJumpAtMs < 350) return false;
        var cur = Number(lastInfo.currentTime);
        if (!isFinite(cur) || cur < 0) return false;
        var effEnd = lastInfo.duration > 1 && abState.endSec >= lastInfo.duration - 0.35
          ? Math.max(abState.startSec + 0.5, lastInfo.duration - 0.35)
          : abState.endSec;
        if (cur >= effEnd - 0.05 || (abState.startSec > 0 && cur < abState.startSec - 1.2)) {
          abState.lastJumpAtMs = now;
          execYtCommand('seekTo', [abState.startSec, true]);
          execYtCommand('playVideo', []);
          return true;
        }
        return false;
      }

      function execYtCommand(func, args) {
        var safeArgs = Array.isArray(args) ? args.slice() : [];
        if (func === 'seekBy') {
          var delta = Number(safeArgs[0]) || 0;
          var snapNow = readLiveSnapshotFromYtPlayer();
          var baseT = typeof snapNow.currentTime === 'number' && isFinite(snapNow.currentTime) ? snapNow.currentTime : 0;
          var dur = typeof snapNow.duration === 'number' && isFinite(snapNow.duration) ? snapNow.duration : 0;
          var nextT = Math.max(0, dur > 1 ? Math.min(dur - 0.5, baseT + delta) : baseT + delta);
          return execYtCommand('seekTo', [nextT, true]);
        }
        if (func === 'togglePlayPause') {
          var stNow = readLiveSnapshotFromYtPlayer().playerState;
          return execYtCommand(stNow === 1 || stNow === 3 ? 'pauseVideo' : 'playVideo', []);
        }
        if (func === 'setLoop') {
          loopEnabled = Boolean(safeArgs[0]);
        }
        if (func === 'setAbLoop') {
          abState.enabled = Boolean(safeArgs[0]);
          abState.startSec = typeof safeArgs[1] === 'number' && isFinite(safeArgs[1]) ? safeArgs[1] : null;
          abState.endSec = typeof safeArgs[2] === 'number' && isFinite(safeArgs[2]) ? safeArgs[2] : null;
          abState.lastJumpAtMs = 0;
          if (abState.enabled && abState.startSec !== null && abState.endSec !== null) {
            enforceLocalAbLoop();
          }
          return true;
        }
        if (func === 'setPlaybackRate' && typeof safeArgs[0] === 'number' && safeArgs[0] > 2) {
          safeArgs[0] = 2;
        }
        if (!ytReady && !acked) {
          if (pendingCmds.length < 32) {
            pendingCmds.push({ func: func, args: safeArgs });
          }
        }
        // 1) Gửi qua YT.Player API chính thức nếu sẵn sàng
        if (ytPlayer && ytReady && typeof ytPlayer[func] === 'function') {
          try {
            ytPlayer[func].apply(ytPlayer, safeArgs);
          } catch (_eApi) {}
        }
        // 2) LUÔN gửi đồng thời qua postMessage JSON chuẩn với ĐÚNG ytWidgetId để 100% lệnh Tua/Dừng/Phát/Tốc độ/Âm thanh đi thẳng vào iframe!
        sendRawToYt({
          event: 'command',
          func: func,
          args: safeArgs,
          id: ytWidgetId,
          channel: 'widget'
        });
        if (ytWidgetId !== 1) {
          sendRawToYt({
            event: 'command',
            func: func,
            args: safeArgs,
            id: 1,
            channel: 'widget'
          });
        }

        if (func === 'seekTo' && typeof safeArgs[0] === 'number') {
          lastInfo.currentTime = Math.max(0, safeArgs[0]);
        } else if (func === 'playVideo') {
          lastInfo.playerState = 1;
        } else if (func === 'pauseVideo') {
          lastInfo.playerState = 2;
        } else if (func === 'setPlaybackRate' && typeof safeArgs[0] === 'number') {
          lastInfo.playbackRate = safeArgs[0];
        } else if (func === 'mute') {
          lastInfo.muted = true;
        } else if (func === 'unMute') {
          lastInfo.muted = false;
        } else if (func === 'setVolume' && typeof safeArgs[0] === 'number') {
          lastInfo.volume = safeArgs[0];
        }
        postSyncToParent(Object.assign({}, lastInfo));
        return true;
      }

      window.__mod39ExecPipCommand = function (func, args) {
        if (!func) return false;
        return execYtCommand(func, args || []);
      };
      window.__mod39GetLivePipSnapshot = function () {
        return readLiveSnapshotFromYtPlayer();
      };
      window.__mod39ShutdownPipPlayer = function () {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (handshakeTimer) { clearInterval(handshakeTimer); handshakeTimer = null; }
        var finalSnap = readLiveSnapshotFromYtPlayer();
        try {
          if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
          if (ytPlayer && typeof ytPlayer.destroy === 'function') ytPlayer.destroy();
        } catch (_eD) {}
        try {
          if (iframe) iframe.src = 'about:blank';
        } catch (_eI) {}
        return finalSnap;
      };

      function flushPendingCommands() {
        if (!pendingCmds.length) return;
        var queue = pendingCmds.splice(0, pendingCmds.length);
        for (var i = 0; i < queue.length; i++) {
          execYtCommand(queue[i].func, queue[i].args);
        }
      }

      function applyInitialPrefsOnce() {
        if (appliedInitialPrefs) return;
        appliedInitialPrefs = true;
        setTimeout(function () {
          if (rate && Math.abs(rate - 1) > 0.01) {
            execYtCommand('setPlaybackRate', [rate > 2 ? 2 : rate]);
          }
          if (mute === '1') {
            execYtCommand('mute', []);
          } else {
            execYtCommand('unMute', []);
            execYtCommand('setVolume', [vol]);
          }
          flushPendingCommands();
        }, 140);
      }

      function startListeningHandshake() {
        if (handshakeTimer) clearInterval(handshakeTimer);
        var tries = 0;
        var pulse = function () {
          if (acked || tries >= 40) {
            if (handshakeTimer) {
              clearInterval(handshakeTimer);
              handshakeTimer = null;
            }
            return;
          }
          tries += 1;
          sendRawToYt({ event: 'listening', id: 1, channel: 'widget' });
        };
        pulse();
        handshakeTimer = setInterval(pulse, 180);
      }

      function startPollingLoop() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(function () {
          var snap = readLiveSnapshotFromYtPlayer();
          enforceLocalAbLoop();
          postSyncToParent(snap);
        }, 160);
      }

      function attachYtApi() {
        if (ytPlayer || !window.YT || !window.YT.Player) return;
        try {
          ytPlayer = new window.YT.Player('yt-inner-embed', {
            host: 'https://www.youtube-nocookie.com',
            events: {
              onReady: function () {
                ytReady = true;
                acked = true;
                if (handshakeTimer) { clearInterval(handshakeTimer); handshakeTimer = null; }
                applyInitialPrefsOnce();
                flushPendingCommands();
                startPollingLoop();
                postSyncToParent(readLiveSnapshotFromYtPlayer());
              },
              onStateChange: function (e) {
                if (typeof e.data === 'number') {
                  lastInfo.playerState = e.data;
                  var snap = readLiveSnapshotFromYtPlayer();
                  postSyncToParent(snap);
                  if (e.data === 0 && loopEnabled && !abState.enabled) {
                    execYtCommand('seekTo', [0, true]);
                    execYtCommand('playVideo', []);
                  }
                }
              },
              onPlaybackRateChange: function (e) {
                if (typeof e.data === 'number' && e.data > 0) {
                  lastInfo.playbackRate = e.data;
                  postSyncToParent(readLiveSnapshotFromYtPlayer());
                }
              }
            }
          });
        } catch (_eYt) {}
      }

      iframe.addEventListener('load', function () {
        acked = false;
        startListeningHandshake();
        startPollingLoop();
        if (window.YT && window.YT.Player) attachYtApi();
      });

      window.onYouTubeIframeAPIReady = attachYtApi;
      var apiScript = document.createElement('script');
      apiScript.src = 'https://www.youtube.com/iframe_api';
      apiScript.async = true;
      document.head.appendChild(apiScript);

      window.addEventListener('message', function (ev) {
        if (!ev || !ev.data) return;

        if (typeof ev.data === 'object' && ev.data.__mod39PipCmd) {
          if (ev.data.sid && ev.data.sid !== sid) return;
          if (ev.data.type === 'close') {
            window.__mod39ShutdownPipPlayer();
            return;
          }
          if (ev.data.func) {
            execYtCommand(ev.data.func, ev.data.args || []);
          }
          return;
        }

        // Nhận infoDelivery trực tiếp từ youtube-nocookie.com (hoạt động 100% kể cả khi YT.Player onReady không kích hoạt trong Document PiP!)
        var org = String(ev.origin || '');
        if (org && org.indexOf('youtube.com') === -1 && org.indexOf('youtube-nocookie.com') === -1) return;
        var data = ev.data;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch (_e) { return; }
        }
        if (!data || typeof data !== 'object') return;

        if (data.id !== undefined && data.id !== null) {
          ytWidgetId = data.id;
        }

        if (!acked) {
          acked = true;
          if (handshakeTimer) { clearInterval(handshakeTimer); handshakeTimer = null; }
          ['onStateChange', 'onPlaybackRateChange', 'onError'].forEach(function (evName) {
            sendRawToYt({ event: 'command', func: 'addEventListener', args: [evName], id: ytWidgetId, channel: 'widget' });
          });
          startPollingLoop();
          flushPendingCommands();
        }

        if (data.event === 'onReady' || data.event === 'initialDelivery' || data.event === 'infoDelivery') {
          applyInitialPrefsOnce();
        }

        if ((data.event === 'infoDelivery' || data.event === 'initialDelivery') && data.info && typeof data.info === 'object') {
          if (typeof data.info.currentTime === 'number' && isFinite(data.info.currentTime)) lastInfo.currentTime = data.info.currentTime;
          if (typeof data.info.duration === 'number' && data.info.duration > 0) lastInfo.duration = data.info.duration;
          if (typeof data.info.playerState === 'number') {
            lastInfo.playerState = data.info.playerState;
            if (data.info.playerState === 0 && loopEnabled && !abState.enabled) {
              execYtCommand('seekTo', [0, true]);
              execYtCommand('playVideo', []);
            }
          }
          if (typeof data.info.playbackRate === 'number' && data.info.playbackRate > 0) lastInfo.playbackRate = data.info.playbackRate;
          if (typeof data.info.volume === 'number' && isFinite(data.info.volume)) lastInfo.volume = data.info.volume;
          if (typeof data.info.muted === 'boolean') lastInfo.muted = data.info.muted;
          if (data.info.videoData && typeof data.info.videoData === 'object') {
            if (data.info.videoData.video_id && /^[A-Za-z0-9_-]{11}$/.test(String(data.info.videoData.video_id))) {
              lastInfo.videoId = String(data.info.videoData.video_id);
            }
            if (data.info.videoData.title) lastInfo.title = String(data.info.videoData.title);
          }
          enforceLocalAbLoop();
          postSyncToParent(Object.assign({}, lastInfo));
        }
      });

      window.addEventListener('pagehide', function () {
        postSyncToParent(readLiveSnapshotFromYtPlayer());
        if (pollTimer) clearInterval(pollTimer);
        if (handshakeTimer) clearInterval(handshakeTimer);
      });
    })();
  </script>
</body>
</html>
