  <script>
    (function bootStandaloneDangLovePdf() {
      const launch = () => {
        try {
          if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
          }
        } catch (_eSw) {}
        try {
          const params = new URLSearchParams(location.search || '');
          const toolParam = params.get('tool') || '';
          const ctrl = window.NoirStudio?.dangLovePdf;
          if (ctrl && typeof ctrl.openDangLovePdfStudio === 'function') {
            ctrl.init?.();
            ctrl.openDangLovePdfStudio(toolParam || null);
            const bootEl = document.getElementById('danglovepdf-standalone-boot');
            if (bootEl) bootEl.classList.add('hidden');
          }
        } catch (err) {
          const bootEl = document.getElementById('danglovepdf-standalone-boot');
          if (bootEl) {
            bootEl.innerHTML = '<div class="text-rose-400 font-bold text-sm">Không khởi tạo được ĐăngLovePDF: ' + (err?.message || err) + '</div><a href="index.html" data-noir-internal-nav class="mt-3 inline-block px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">← Về Trang Web Gốc</a>';
          }
        }
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', launch);
      } else {
        launch();
      }
    })();
  </script>
